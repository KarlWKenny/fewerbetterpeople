# Cloudflare Workers configuration — static assets deployment.
# Deployed by Workers Builds (Git integration): build command `npm run build`,
# deploy command `npx wrangler deploy`. Pushes to main go to production.
#
# Server endpoints later: add `main = "src/worker.ts"` here plus
# `run_worker_first = ["/api/*"]` under [assets], and write the endpoints in
# that worker script. No host migration needed.
name = "fewerbetterpeople"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
