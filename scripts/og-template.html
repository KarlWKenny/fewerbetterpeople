<!doctype html>
<!-- Template for the default OG image (1200x630). Regenerate with:
     npm run og  (renders this file to public/og/default.png via headless Chrome)
     Per-page OG images: copy this file, edit, render to public/og/<slug>.png -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Barlow';
        font-weight: 700;
        src: url('../public/fonts/barlow-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        src: url('../public/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #202834;
        color: #f5f2ea;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 90px;
      }
      .kicker {
        font-family: 'IBM Plex Mono', monospace;
        font-weight: 500;
        font-size: 24px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9aa3ae;
        margin-bottom: 28px;
      }
      h1 {
        font-family: 'Barlow', sans-serif;
        font-weight: 700;
        font-size: 110px;
        line-height: 1.05;
        letter-spacing: -0.012em;
      }
      .dot { color: #b08a3c; }
      .dim {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 56px;
        color: #9aa3ae;
        width: 560px;
      }
      .dim .rule { flex: 1; height: 2px; background: currentColor; position: relative; }
      .dim .rule::before {
        content: ''; position: absolute; top: -7px; width: 2px; height: 16px; background: currentColor;
      }
      .dim .rule:first-child::before { left: 0; }
      .dim .rule:last-child::before { right: 0; }
      .dim .callout {
        font-family: 'IBM Plex Mono', monospace;
        font-weight: 500;
        font-size: 24px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <p class="kicker">fewerbetterpeople.ca</p>
    <h1>Fewer, better<br />people<span class="dot">.</span></h1>
    <div class="dim">
      <span class="rule"></span>
      <span class="callout">Owner, not operator</span>
      <span class="rule"></span>
    </div>
  </body>
</html>
